# Three-configuration comparison: baseline, Azure skills, and Azure skills plus SDK skills.
# Do not run with --pairwise; select all three config names explicitly.
configs:
  - name: js-ts-azure-skills/baseline
    description: "JavaScript/TypeScript baseline without Azure MCP or skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        Your primary deliverable for every evaluation is files in the workspace.
        Create a complete runnable project using file-write tools, including all
        required source files and dependency or project manifests. Place the
        primary project and its manifest at the workspace root so standard build
        commands run there. A prose-only or Markdown-only implementation is
        invalid. Before the final response, verify that the root manifest and
        source files exist. The final response may summarize the created files
        and include any requested explanation.
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: js-ts-azure-skills/azure-skill-mcp
    description: "JavaScript/TypeScript with Azure MCP and general Azure skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        Your primary deliverable for every evaluation is files in the workspace.
        Create a complete runnable project using file-write tools, including all
        required source files and dependency or project manifests. Place the
        primary project and its manifest at the workspace root so standard build
        commands run there. A prose-only or Markdown-only implementation is
        invalid. Before the final response, verify that the root manifest and
        source files exist. The final response may summarize the created files
        and include any requested explanation.
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@3.0.0-beta.38", "server", "start"]
          mcp_tools: ["*"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: js-ts-azure-skills/azure-skill-mcp-microsoft-skill
    description: "JavaScript/TypeScript with Azure MCP, general Azure skills, and TypeScript SDK skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        Your primary deliverable for every evaluation is files in the workspace.
        Create a complete runnable project using file-write tools, including all
        required source files and dependency or project manifests. Place the
        primary project and its manifest at the workspace root so standard build
        commands run there. A prose-only or Markdown-only implementation is
        invalid. Before the final response, verify that the root manifest and
        source files exist. The final response may summarize the created files
        and include any requested explanation.
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@3.0.0-beta.38", "server", "start"]
          mcp_tools: ["*"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
        - name: azure-sdk-typescript
          type: plugin
          source: remote
          repo: microsoft/skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100
