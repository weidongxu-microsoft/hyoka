# Three-arm Foundry comparison: baseline, all Foundry tools except the
# language-specific Microsoft SDK skills, and all Foundry tools.
# Run with --tags foundry. Do not use --pairwise; select all three config names.
configs:
  - name: dotnet-azure-tools/baseline
    description: ".NET baseline without Azure MCP or Microsoft SDK skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        When the prompt requests code, create a complete runnable project in the
        workspace using file-write tools. Include all required source files and
        dependency or project manifests. Place the primary project and its
        manifest at the workspace root so standard build commands run there.
        Do not provide the implementation only as Markdown code blocks in the
        final response. The final response may summarize the created files and
        include any requested explanation.
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: dotnet-azure-tools/azure-skill-mcp
    description: ".NET with Azure MCP, Foundry MCP, and general Azure skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        When the prompt requests code, create a complete runnable project in the
        workspace using file-write tools. Include all required source files and
        dependency or project manifests. Place the primary project and its
        manifest at the workspace root so standard build commands run there.
        Do not provide the implementation only as Markdown code blocks in the
        final response. The final response may summarize the created files and
        include any requested explanation.
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@3.0.0-beta.38", "server", "start"]
          mcp_tools: ["*"]
        - name: foundry
          type: mcp
          mcp_type: remote
          url: https://mcp.ai.azure.com
          mcp_tools: ["*"]
          mcp_auth: azure_cli
          mcp_scopes: ["https://mcp.ai.azure.com/Foundry.Mcp.Tools"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: dotnet-azure-tools/with-azure-tools
    description: ".NET with Azure MCP, Foundry MCP, general Azure skills, and .NET SDK skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        When the prompt requests code, create a complete runnable project in the
        workspace using file-write tools. Include all required source files and
        dependency or project manifests. Place the primary project and its
        manifest at the workspace root so standard build commands run there.
        Do not provide the implementation only as Markdown code blocks in the
        final response. The final response may summarize the created files and
        include any requested explanation.
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@3.0.0-beta.38", "server", "start"]
          mcp_tools: ["*"]
        - name: foundry
          type: mcp
          mcp_type: remote
          url: https://mcp.ai.azure.com
          mcp_tools: ["*"]
          mcp_auth: azure_cli
          mcp_scopes: ["https://mcp.ai.azure.com/Foundry.Mcp.Tools"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
        - name: azure-sdk-dotnet
          type: plugin
          source: remote
          repo: microsoft/skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100
